[package]
name = "live-poly-trans"
version = "0.1.0"
description = "Realtime multilingual transcription and translation"
authors = ["staticWagomU"]
edition = "2021"

[lib]
name = "live_poly_trans_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cpal = "0.18.1"
hound = "3.5"
lpt-core = { path = "../crates/lpt-core" }
lpt-whisper = { path = "../crates/lpt-whisper" }
rtrb = "0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
mach2 = "0.4"
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-core-audio = { version = "0.3.2", features = ["AudioHardware", "objc2"] }
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
