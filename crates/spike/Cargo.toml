[package]
name = "spike"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# whisper-rs and llama-cpp-2 each vendor their own ggml; linking both into one
# binary merges the duplicate C symbols and whisper ends up calling llama's ggml
# (version-mismatched) at runtime. Features let us build isolated binaries for
# measurement while the unification strategy is decided (see plan.md Step 0).
[features]
default = ["asr", "llm"]
asr = ["dep:whisper-rs", "dep:kkm-whisper", "dep:cpal"]
llm = ["dep:llama-cpp-2"]
# transcribe.cpp vendors a third ggml, so it is exclusive with `asr` for the
# same reason `asr` and `llm` are: one binary, one ggml.
parakeet = ["dep:transcribe-cpp"]

[dependencies]
kkm-core = { path = "../kkm-core" }
kkm-whisper = { path = "../kkm-whisper", optional = true }
anyhow = "1"
whisper-rs = { version = "0.16.0", features = ["metal"], optional = true }
llama-cpp-2 = { version = "0.1.154", features = ["metal"], optional = true }
transcribe-cpp = { version = "0.2.1", optional = true }
cpal = { version = "0.18.1", optional = true }
hound = "3.5.1"
libc = "0.2.189"
libloading = "0.8"
objc2-core-audio = { version = "0.3.2", features = ["AudioHardware", "objc2"] }
objc2-core-audio-types = "0.3.2"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-core-foundation = "0.3.2"
block2 = "0.6.2"
dispatch2 = "0.3.1"

[[bin]]
name = "spike"
path = "src/main.rs"

# Feature-free on purpose: build with --no-default-features to skip the
# whisper/llama builds entirely (ADR-153803 Process Tap spike).
[[bin]]
name = "tap-check"
path = "src/bin/tap_check.rs"

[[bin]]
name = "pipeline-check"
path = "src/bin/pipeline_check.rs"
required-features = ["asr"]

# Must be built WITHOUT the llm feature: the whole point is that llama
# lives in the kkm-translate-ggml cdylib, not in this binary.
[[bin]]
name = "cdylib-check"
path = "src/bin/cdylib_check.rs"
required-features = ["asr"]

# Build with --no-default-features --features parakeet: transcribe.cpp's ggml
# must not meet whisper-rs's or llama's in one binary (ADR-153805).
[[bin]]
name = "nemotron-check"
path = "src/bin/nemotron_check.rs"
required-features = ["parakeet"]
