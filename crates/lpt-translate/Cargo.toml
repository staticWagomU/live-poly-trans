[package]
name = "lpt-translate"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Host side of the translation backend: it dlopens lpt-translate-ggml rather
# than linking it, which is the whole point — llama-cpp-2 must not end up in
# the same image as whisper-rs (docs/step0-results.md). Nothing here pulls in
# llama-cpp-2, and nothing here may.
[dependencies]
anyhow = "1"
libloading = "0.8"
lpt-core = { path = "../lpt-core" }
